name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  DATABASE_URL: 'postgresql://billing:billing_password@localhost:5432/billing_test'

jobs:
  # ── Gate 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint:check

  # ── Gate 2: Type Check ───────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript type check
        run: npm run typecheck

  # ── Gate 3: Unit Tests ───────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for XSD 1.1 validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XSD validator dependencies
        run: python -m pip install -r src/modules/fiscal-documents/infrastructure/xml/xsd11/requirements.txt

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests without database access
        run: npm test -- --silent
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
          NODE_ENV: test
          SECRET_PROVIDER: env
          USE_REAL_HACIENDA: 'false'

      - name: Verify P0 safety contracts
        run: npm run test:safety

      - name: Verify static test safety
        run: npm run test:safety:static

      - name: Run database concurrency tests in disposable PostgreSQL
        run: npm run test:db-regression:disposable

  # ── Gate 4: Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

  # ── Gate 5: E2E Tests ────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for XSD 1.1 validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XSD validator dependencies
        run: python -m pip install -r src/modules/fiscal-documents/infrastructure/xml/xsd11/requirements.txt

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests in disposable PostgreSQL
        run: npm run test:e2e:disposable
        env:
          FISCAL_WORKER_ENABLE_IN_TESTS: 'true'
          JWT_SECRET: ci-e2e-jwt-secret-32-chars-minimum
          NODE_ENV: test
          SECRET_PROVIDER: env
          USE_REAL_HACIENDA: 'false'
