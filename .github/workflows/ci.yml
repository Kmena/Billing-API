name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://billing:billing_password@localhost:5432/billing_test'

jobs:
  # ── Gate 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint:check

  # ── Gate 2: Type Check ───────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript type check
        run: npm run typecheck

  # ── Gate 3: Unit Tests ───────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: billing_test
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for XSD 1.1 validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XSD validator dependencies
        run: python -m pip install -r src/modules/fiscal-documents/infrastructure/xml/xsd11/requirements.txt

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run tests
        run: npm test -- --silent
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
          NODE_ENV: test
          SECRET_PROVIDER: env

  # ── Gate 4: Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

  # ── Gate 5: E2E Tests ────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: billing_e2e
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for XSD 1.1 validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XSD validator dependencies
        run: python -m pip install -r src/modules/fiscal-documents/infrastructure/xml/xsd11/requirements.txt

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://billing:billing_password@localhost:5432/billing_e2e'

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://billing:billing_password@localhost:5432/billing_e2e'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: 'postgresql://billing:billing_password@localhost:5432/billing_e2e'
          JWT_SECRET: ci-e2e-jwt-secret-32-chars-minimum
          NODE_ENV: test
          SECRET_PROVIDER: env
          USE_REAL_HACIENDA: 'false'
