openapi: 3.1.0
info:
  title: Billing fiscal intent v2 (W2 proposal)
  version: 0.2.0-proposed
  description: >-
    Design artifact only. This invoice endpoint is NOT part of W1 implementation.
    It cannot accept production traffic until ADR-BIL-013, DP-02 and applicable
    DF-01 through DF-06 decisions are approved and the current fiscal annex/XSD
    has been validated. The existing Inventori v1 API remains unchanged.
x-status: proposed-inactive
x-activation-wave: W2-after-fiscal-approval
x-tax-decision-gates: [ADR-BIL-013, DP-02, DF-01, DF-02, DF-03, DF-04, DF-05, DF-06]
x-w2-a-structural-implementation:
  routesRegistered: false
  fiscalIssuanceEnabled: false
  hashVersion: w2-a-structural.v1
  hashUse: synthetic-comparison-only
  finalFiscalHashRequires: ADR-BIL-013
  decimalTransportCap: { integerDigits: 18, fractionalDigits: 10 }
  opaqueTextPattern: '^\S(?:.*\S)?$'
  normalizedLineOrder: lineNumber-ascending
  preservedArrayOrder: [discounts, taxes, paymentMethods, fiscalReferences]
  absentDistinctFromNull: true
  priceInputModesAccepted: [EXCLUSIVE]
  exemptionDocumentAccepted: false
  taxCodesValidated: false
  taxArithmeticValidated: false
  structuralTotals: [gross, discounts, net, declaredTax, totalBeforeFiscalPolicy]
x-w2-b-laboratory-projection:
  routesRegistered: false
  fiscalIssuanceEnabled: false
  policyMarker: LAB_SYNTHETIC_V44_ONLY
  hashVersion: w2-b-fiscal-lab.v1
  hashUse: synthetic-lab-comparison-only
  finalFiscalHashRequires: ADR-BIL-013
  environment: SANDBOX
  currency: CRC
  saleCondition: '01'
  paymentMethod: '01'
  perLineTaxCount: 1
  perLineDiscountCount: 0-1
  supportedLabXmlPatterns: [LAB_TAXABLE_IVA_13_XML, LAB_EXEMPT_XML]
  precision: { amountFractionDigits: 5, quantityFractionDigits: 3, rounding: reject-inexact }
  unsupported: [multiple-taxes-per-line, multiple-discounts-per-line, exoneration, fiscal-references, credit, multiple-payments, foreign-currency, production-origin]
servers:
  - url: /api/v2
paths:
  /companies/{companyId}/fiscal-documents/{environment}/invoices:
    post:
      summary: Submit an immutable fiscal intent for an electronic invoice
      operationId: createFiscalInvoiceV2
      security: [{ ConsumerApiKey: [] }]
      description: >-
        Billing validates and emits only the approved fiscal representation.
        The consumer owns its commercial ledger, allocation and collection
        decisions. A 201 or 200 identifies a local document; neither means
        Hacienda accepted it. The authenticated consumer association defines
        tenant, issuer and environment. A conflicting replay returns 409 before
        any new consecutive number is allocated.
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: environment
          in: path
          required: true
          schema: { type: string, enum: [SANDBOX, PRODUCTION] }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: X-Fiscal-Payload-Contract-Version
          in: header
          required: true
          schema: { type: string, const: fiscal-payload.v2 }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceIntent' }
            examples:
              twoPeriodsOneAffiliation:
                summary: Synthetic example; tax codes and values are placeholders, not an approved fiscal policy.
                value:
                  externalOperationId: allocation-2026-001
                  policyVersion: issuer-policy-to-approve
                  receiver:
                    identificationType: pending-code
                    identificationNumber: synthetic-123
                    name: Receptor de prueba
                  currency: CRC
                  exchangeRate: null
                  saleCondition: pending-code
                  paymentMethods: []
                  lines:
                    - lineNumber: 1
                      source:
                        affiliationId: affiliation-001
                        periodId: 2026-09
                        allocationId: allocation-001
                      servicePeriod: { startsOn: '2026-09-01', endsOn: '2026-09-30' }
                      description: Concepto aprobado del periodo de septiembre
                      cabysCode: pending-cabys
                      unitCode: pending-unit
                      quantity: '1.00000'
                      unitPrice: '1000.00000'
                      priceInputMode: EXCLUSIVE
                      discounts: []
                      taxTreatment: pending-treatment
                      taxes: []
                    - lineNumber: 2
                      source:
                        affiliationId: affiliation-001
                        periodId: 2026-10
                        allocationId: allocation-002
                      servicePeriod: { startsOn: '2026-10-01', endsOn: '2026-10-31' }
                      description: Concepto aprobado del periodo de octubre
                      cabysCode: pending-cabys
                      unitCode: pending-unit
                      quantity: '1.00000'
                      unitPrice: '1000.00000'
                      priceInputMode: EXCLUSIVE
                      discounts: []
                      taxTreatment: pending-treatment
                      taxes: []
      responses:
        '201':
          description: New local document identity. No official acceptance implied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceOperation' }
        '200':
          description: Exact replay; same local identity and payload hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    ConsumerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Association-bound M2M key with invoices:create; W2 gated.
  schemas:
    Decimal:
      type: string
      pattern: '^\d{1,18}(?:\.\d{1,10})?$'
      description: W2-A technical transport bound, not an approved fiscal scale or rounding rule. No exponent or sign.
    Quantity:
      type: string
      pattern: '^(?!0+(?:\.0+)?$)\d{1,18}(?:\.\d{1,10})?$'
      description: Positive exact transport decimal; final fiscal precision awaits ADR-BIL-013.
    SourceReference:
      type: object
      additionalProperties: false
      description: >-
        Opaque audit provenance owned by the consumer; never serialized as
        an invented fiscal XML node and never used by Billing to calculate debt.
      minProperties: 1
      properties:
        affiliationId: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
        periodId: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
        allocationId: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
        paymentId: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$', description: Opaque commercial provenance; never an XML fiscal reference by itself. }
    ServicePeriod:
      type: object
      additionalProperties: false
      required: [startsOn, endsOn]
      properties:
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
    Receiver:
      type: object
      additionalProperties: false
      required: [identificationType, identificationNumber, name]
      properties:
        identificationType: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Code subject to applicable fiscal validation. }
        identificationNumber: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$' }
        name: { type: string, minLength: 1, maxLength: 200, pattern: '^\S(?:.*\S)?$' }
        email: { type: string, format: email, maxLength: 254 }
    Discount:
      type: object
      additionalProperties: false
      required: [amount, reasonCode]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        reasonCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Fiscal code requires approved mapping. }
        reason: { type: string, minLength: 1, maxLength: 200, pattern: '^\S(?:.*\S)?$' }
    DeclaredTax:
      type: object
      additionalProperties: false
      required: [code, rateCode, rate, base, amount]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: No code approved by this proposal. }
        rateCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$' }
        rate: { $ref: '#/components/schemas/Decimal' }
        base: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal' }
      description: Exemption documentation is rejected by W2-A until DF-03 defines a closed schema.
    FiscalLine:
      type: object
      additionalProperties: false
      required: [lineNumber, description, cabysCode, unitCode, quantity, unitPrice, priceInputMode, discounts, taxTreatment, taxes]
      properties:
        lineNumber: { type: integer, minimum: 1, maximum: 1000, description: Must be unique within the invoice; server rejects duplicates before reservation. }
        source: { $ref: '#/components/schemas/SourceReference' }
        servicePeriod: { $ref: '#/components/schemas/ServicePeriod' }
        description: { type: string, minLength: 1, maxLength: 500, pattern: '^\S(?:.*\S)?$' }
        cabysCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Validate against catalog applicable on issue date. }
        unitCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Exact code/mapping subject to tax validation. }
        quantity: { $ref: '#/components/schemas/Quantity' }
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        priceInputMode:
          type: string
          enum: [EXCLUSIVE, INCLUSIVE]
          description: INCLUSIVE is disabled until an approved decomposition rule exists.
          x-w2-a-accepted: [EXCLUSIVE]
        discounts:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Discount' }
        taxTreatment:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^\S(?:.*\S)?$'
          description: Declared intent; allowed values, evidence and fiscal mapping await DF decisions.
        taxes:
          type: array
          maxItems: 20
          description: Technical W2-A abuse bound; applicable tax combinations await DF-03.
          items: { $ref: '#/components/schemas/DeclaredTax' }
    PaymentMethod:
      type: object
      additionalProperties: false
      required: [code, amount]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Requires fiscal catalog validation. }
        amount: { $ref: '#/components/schemas/Decimal' }
    FiscalReference:
      type: object
      additionalProperties: false
      description: >-
        Proposed mapping to Hacienda InformacionReferencia. Codes, required
        fields and applicability depend on document type and approved policy;
        this is separate from commercial SourceReference.
      required: [documentTypeCode, issuedAt]
      properties:
        documentTypeCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$' }
        documentNumber: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
        issuedAt: { type: string, format: date-time, description: Timezone required in W2-A. }
        reasonCode: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$' }
        reason: { type: string, minLength: 1, maxLength: 200, pattern: '^\S(?:.*\S)?$' }
    InvoiceIntent:
      type: object
      additionalProperties: false
      required: [externalOperationId, policyVersion, receiver, currency, saleCondition, paymentMethods, lines]
      properties:
        externalOperationId: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
        policyVersion: { type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$', description: Approved issuer policy reference; not a Billing-created tax rule. }
        receiver: { $ref: '#/components/schemas/Receiver' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Catalog validation and currency decisions pending. }
        exchangeRate: { type: [string, 'null'], pattern: '^\d{1,18}(?:\.\d{1,10})?$', description: Exact transport decimal if applicable; currency rule pending. }
        saleCondition: { type: string, minLength: 1, maxLength: 64, pattern: '^\S(?:.*\S)?$', description: Catalog validation pending. }
        fiscalReferences:
          type: array
          maxItems: 10
          description: Optional for FE only when the approved fiscal scenario permits it; mandatory for certain document types.
          items: { $ref: '#/components/schemas/FiscalReference' }
        paymentMethods:
          type: array
          maxItems: 4
          description: Minimum cardinality depends on approved sale condition; the official annex has credit exceptions.
          items: { $ref: '#/components/schemas/PaymentMethod' }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/FiscalLine' }
    InvoiceOperation:
      type: object
      additionalProperties: false
      required: [documentId, clave, consecutive, documentStatus, submissionStatus, links, payloadHash, correlationId]
      properties:
        documentId: { type: string, format: uuid }
        clave: { type: string, description: Local fiscal identity; acceptance is separate. }
        consecutive: { type: string }
        documentStatus: { type: string }
        submissionStatus: { type: string }
        links: { type: object, additionalProperties: { type: string, format: uri-reference } }
        payloadHash: { type: string }
        correlationId: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
  responses:
    BadRequest:
      description: Invalid shape or unsupported contract version.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, expired or revoked credential.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: No scope or issuer association.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found or inaccessible in this namespace.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: IDEMPOTENCY_PAYLOAD_CONFLICT or an integrity conflict; no new number allocated.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Fiscal meaning or required evidence cannot be validated under an approved policy.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Caller rate limit; retryable after Retry-After.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Dependency unavailable; retry with the same idempotency key after reconciliation.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
