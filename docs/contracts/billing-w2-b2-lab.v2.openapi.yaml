openapi: 3.1.0
info:
  title: Billing W2-B2 FE and TE fiscal creation, disposable laboratory only
  version: 0.2.0-lab
  description: >-
    Executable synthetic SANDBOX subset. Its controller is registered only by
    W2B2FiscalLabModule in NODE_ENV=test and is absent from AppModule. This is
    not the approved fiscal-payload.v2 contract or a production route.
x-status: lab-only-inactive-in-product
x-hash-version: w2-b-fiscal-lab.v1
x-ticket-hash-version: w2-b-ticket-fiscal-lab.v1
x-policy-marker: LAB_SYNTHETIC_V44_ONLY
x-status-lookup: /api/v2/companies/{companyId}/fiscal-documents/{environment}/operations/lookup
x-status-lookup-requires: [operation, idempotencyKey, requestHashVersion, requestHash]
x-approval-gates: [ADR-BIL-011, ADR-BIL-012, ADR-BIL-013, ADR-BIL-016, DP-01, DP-02]
servers:
  - url: /api/v2/lab
paths:
  /companies/{companyId}/fiscal-documents/{environment}/invoices:
    post:
      operationId: createSyntheticInvoiceW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:invoices:create
      description: >-
        Only SANDBOX and the W2-B synthetic projection are accepted. The
        association, tenant and environment come from the M2M key. A successful
        local document and signed XML do not imply Hacienda acceptance.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabInvoiceIntent' }
      responses:
        '201': { description: New local fiscal document with signed XML, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '200': { description: Exact replay of the same local document, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '202': { description: Recoverable XML processing or concurrent lease; retry the same request, headers: { Retry-After: { schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '400': { description: Invalid or unsupported structural input }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '409': { description: Same idempotency key with different fiscal hash }
        '422': { description: Fiscal policy pending approval or terminal XML validation failure }
        '503': { description: Retryable interruption before a response }
  /companies/{companyId}/fiscal-documents/{environment}/invoices/{documentId}:
    get:
      operationId: getSyntheticInvoiceW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:operations:read
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Document status and safe XML/submission error codes belonging to the authenticated association, content: { application/json: { schema: { $ref: '#/components/schemas/LabDocumentStatus' } } } }
        '404': { description: Document absent or belonging to another association }
  /companies/{companyId}/fiscal-documents/{environment}/invoices/{documentId}/signed-xml:
    get:
      operationId: getSyntheticInvoiceSignedXmlW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:operations:read
      description: >-
        Laboratory-only download of the existing signed XML for an invoice owned by
        the authenticated consumer and association. The original stored bytes are
        returned after SHA-256 verification; no XML is generated or signed here.
        A document awaiting signed XML returns 404. READY_TO_SUBMIT is a local
        Billing state and does not mean Hacienda acceptance.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Integrity-verified, unchanged signed invoice XML
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Content-SHA256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content:
            application/xml: { schema: { type: string, format: binary } }
        '400': { description: Invalid document identifier }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '404': { description: Invoice outside authenticated origin or signed XML unavailable }
        '422': { description: Stored signed XML fails SHA-256 verification }
  /companies/{companyId}/fiscal-documents/{environment}/invoices/{documentId}/submit:
    post:
      operationId: submitSyntheticInvoiceToStagW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:invoices:submit
      description: >-
        Opt-in SPEC-09 persistent SANDBOX only. Queues a signed invoice for Hacienda
        STAG. The response means queued, never accepted. The authenticated association
        must own the document and have an active SANDBOX Hacienda connection.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Durable submission queued or already in progress; never proof of acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabSubmission' }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '404': { description: Document outside authenticated origin }
        '409': { description: Signed XML or Hacienda connection not ready }
  /companies/{companyId}/fiscal-documents/{environment}/invoices/{documentId}/submission:
    get:
      operationId: getSyntheticInvoiceStagStatusW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:operations:read
      description: >-
        Reads the durable submission state. Only ACCEPTED confirms acceptance by
        Hacienda STAG; ACKNOWLEDGED is merely receipt of the POST request.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Safe status and normalized error code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabSubmission' }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '404': { description: Document or submission outside authenticated origin }
  /companies/{companyId}/fiscal-documents/{environment}/tickets:
    post:
      operationId: createSyntheticTicketW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:tickets:create
      description: >-
        Only a synthetic SANDBOX TE is accepted. The receiver may be omitted;
        CABYS must have exactly 13 digits per line. One exact payment method
        (01 cash, 02 card, or 04 transfer) must equal the calculated total.
        LAB_TAXABLE_IVA_13_XML and LAB_EXEMPT_XML are the only laboratory
        treatments. Signed XML remains local; Hacienda is not contacted.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketIntent' }
      responses:
        '201': { description: New local TE with signed XML, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '200': { description: Exact replay, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '202': { description: Recoverable operation; retry same request, headers: { Retry-After: { schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LabOperation' } } } }
        '400': { description: Invalid CABYS or structural input }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '409': { description: Changed payload under the same TE idempotency key }
        '422': { description: Unapproved tax treatment or terminal XML validation failure }
        '503': { description: Retryable interruption }
  /companies/{companyId}/fiscal-documents/{environment}/tickets/{documentId}:
    get:
      operationId: getSyntheticTicketW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:operations:read
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Local TE status and safe error codes, content: { application/json: { schema: { $ref: '#/components/schemas/LabDocumentStatus' } } } }
        '404': { description: TE absent or outside authenticated origin }
  /companies/{companyId}/fiscal-documents/{environment}/tickets/{documentId}/signed-xml:
    get:
      operationId: getSyntheticTicketSignedXmlW2B2Lab
      security: [{ ConsumerApiKey: [] }]
      x-required-scope: fiscal-v2:operations:read
      description: >-
        Returns unchanged, SHA-256-verified signed TE XML stored by the common
        fiscal engine. A document awaiting XML returns 404.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Environment'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Integrity-verified signed TE XML
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Content-SHA256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content:
            application/xml: { schema: { type: string, format: binary } }
        '401': { description: Missing, expired or revoked M2M key }
        '403': { description: Scope, association or environment denied }
        '404': { description: TE outside authenticated origin or signed XML unavailable }
        '422': { description: Stored signed XML fails SHA-256 verification }
components:
  securitySchemes:
    ConsumerApiKey: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Environment:
      name: environment
      in: path
      required: true
      schema: { type: string, const: SANDBOX }
  schemas:
    LabSubmission:
      type: object
      additionalProperties: false
      required: [documentId, submissionId, status, environment]
      properties:
        documentId: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        environment: { type: string, const: SANDBOX }
        status:
          type: string
          enum: [REQUESTED, QUEUED, SUBMITTING, POST_OUTCOME_UNKNOWN, ACKNOWLEDGED, PROCESSING, ACCEPTED, REJECTED, TECHNICAL_RETRY_PENDING, MANUAL_REVIEW_REQUIRED, SUPERSEDED]
        lastErrorCode: { type: [string, 'null'], maxLength: 80 }
    LabDiscount:
      allOf:
        - { $ref: 'billing-fiscal-intent.v2.proposed.openapi.yaml#/components/schemas/Discount' }
        - type: object
          required: [amount, reasonCode, reason]
          properties:
            amount: { type: string, pattern: '^\d{1,13}(?:\.\d{1,5})?$' }
            reasonCode: { type: string, enum: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '99'] }
            reason: { type: string, minLength: 3, maxLength: 80 }
      description: One positive fixed amount per line; code 99 also requires a reason of at least 5 characters.
    LabFiscalLine:
      allOf:
        - { $ref: 'billing-fiscal-intent.v2.proposed.openapi.yaml#/components/schemas/FiscalLine' }
        - type: object
          properties:
            cabysCode: { type: string, pattern: '^\d{13}$' }
            priceInputMode: { type: string, const: EXCLUSIVE }
            discounts: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/LabDiscount' } }
            taxTreatment: { type: string, enum: [LAB_TAXABLE_IVA_13_XML, LAB_EXEMPT_XML] }
            taxes:
              type: array
              minItems: 1
              maxItems: 1
              items:
                oneOf:
                  - { type: object, properties: { code: { const: '01' }, rateCode: { const: '08' }, rate: { const: '13' } } }
                  - { type: object, properties: { code: { const: '01' }, rateCode: { const: '10' }, rate: { const: '0' } } }
      description: >-
        Gross is quantity times unit price; discount is subtracted once from gross.
        Declared tax base must equal net. Only IVA 13% (01/08) and exempt
        (01/10) synthetic combinations are projected. Inexact five-decimal
        products and taxes are rejected; no implicit rounding is performed.
    LabInvoiceIntent:
      allOf:
        - { $ref: 'billing-fiscal-intent.v2.proposed.openapi.yaml#/components/schemas/InvoiceIntent' }
        - type: object
          properties:
            policyVersion: { type: string, const: LAB_SYNTHETIC_V44_ONLY }
            currency: { type: string, const: CRC }
            saleCondition: { type: string, const: '01' }
            paymentMethods: { type: array, minItems: 1, maxItems: 1, items: { $ref: '#/components/schemas/LabPaymentMethod' } }
            lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/LabFiscalLine' } }
    LabPaymentMethod:
      allOf:
        - { $ref: 'billing-fiscal-intent.v2.proposed.openapi.yaml#/components/schemas/PaymentMethod' }
        - { type: object, properties: { code: { type: string, enum: ['01', '02', '04'] } } }
    TicketIntent:
      type: object
      additionalProperties: false
      required: [externalOperationId, policyVersion, currency, saleCondition, paymentMethods, lines]
      properties:
        externalOperationId: { type: string, minLength: 1, maxLength: 128 }
        policyVersion: { type: string, const: LAB_SYNTHETIC_V44_ONLY }
        receiver: { $ref: 'billing-fiscal-intent.v2.proposed.openapi.yaml#/components/schemas/Receiver' }
        currency: { type: string, const: CRC }
        saleCondition: { type: string, const: '01' }
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/LabPaymentMethod' }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/LabFiscalLine' }
    LabDocumentStatus:
      type: object
      additionalProperties: false
      required: [id, status, clave, consecutive, submissionStatus, errors]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        clave: { type: string }
        consecutive: { type: string }
        submissionStatus: { type: [string, 'null'] }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [phase, code]
            properties:
              phase: { type: string, enum: [XML, SUBMISSION] }
              code: { type: string }
    LabOperation:
      type: object
      additionalProperties: false
      required: [operationId, documentId, documentStatus, state, clave, consecutive, correlationId]
      properties:
        operationId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentStatus: { type: string, enum: [READY_FOR_XML, READY_TO_SUBMIT] }
        state: { type: string, enum: [COMMITTED, RECOVERY_REQUIRED] }
        clave: { type: string }
        consecutive: { type: string }
        correlationId: { type: string, format: uuid }
